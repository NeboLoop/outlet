Name: outlet
Host: 0.0.0.0
Port: 8888

# Platform Branding
Platform:
  Name: ${PLATFORM_NAME:My Platform}

# App Configuration
App:
  BaseURL: ${APP_BASE_URL}
  Domain: ${APP_DOMAIN}
  ProductionMode: false

# WebSocket Configuration
WebSocket:
  URL: ${WEBSOCKET_URL}

# Database Configuration (SQLite)
Database:
  Path: ${DATABASE_PATH}

# JWT Configuration
Auth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400 # 24 hours
  RefreshSecret: ${JWT_REFRESH_SECRET}
  RefreshExpire: 604800 # 7 days

# Admin account is created through the web setup flow at /setup on first launch

# Google OAuth & Calendar
Google:
  ClientID: ${GOOGLE_CLIENT_ID}
  ClientSecret: ${GOOGLE_CLIENT_SECRET}
  RefreshToken: ${GOOGLE_REFRESH_TOKEN}
  RedirectURL: ${GOOGLE_REDIRECT_URL}

# Email Dispatcher Settings (per-org SMTP config is in database)
# Email:
#   WorkerCount: 10   # Concurrent workers (default: 10)
#   RateLimit: 14     # Emails/sec (default: 14 for SES)
#   RateBurst: 50     # Max burst (default: 50)
#   BatchSize: 100    # Per batch (default: 100)

# Sales Agent
SalesAgent:
  Email: ${SALES_AGENT_EMAIL}

# Zoom Configuration (optional)
Zoom:
  APIKey: ${ZOOM_API_KEY}
  APISecret: ${ZOOM_API_SECRET}
  AccountID: ${ZOOM_ACCOUNT_ID}

# Report Generation Configuration
Reports:
  OutputDir: generated_reports
  PublicURL: /api/downloads/reports
  UploadToS3: false
  S3Bucket:

# Stripe Payment Processing
Stripe:
  SecretKey: ${STRIPE_SECRET_KEY}
  WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
  BaseURL: ${STRIPE_BASE_URL}
  SuccessURL: ${STRIPE_SUCCESS_URL}
  CancelURL: ${STRIPE_CANCEL_URL}

# Encryption for org credentials (32-byte key as 64 hex chars)
Encryption:
  Key: ${ENCRYPTION_KEY}

# gRPC Configuration (LLM streaming)
GRPC:
  Port: 9889

# SMTP Ingress Server (optional, disabled by default)
# Allows sending emails via SMTP protocol with API key authentication
# Set SMTP_ENABLED=true to enable SMTP submission
SMTP:
  enabled: "${SMTP_ENABLED}"
  port: "${SMTP_PORT}"
  tlscert: "${SMTP_TLS_CERT}"
  tlskey: "${SMTP_TLS_KEY}"
  allowinsecureauth: "${SMTP_ALLOW_INSECURE_AUTH}"

# Mailbox pool (off unless POOL_ENABLED=true): warmed mailboxes on pool-only
# domains that a second deployment of this binary sends customers' outreach
# from. The numbers are the proposed Phase 0 starting points.
Pool:
  Enabled: "${POOL_ENABLED}"
  BounceDomain: "${POOL_BOUNCE_DOMAIN}"
  RampStart: 5            # emails a mailbox may send on its first day
  RampStep: 2             # more each day after
  Ceiling: 30             # most a mailbox ever sends in a day
  MinGapSeconds: 240      # at least this long between two sends from one mailbox
  RestDays: 30            # a released mailbox rests this long before another tenant gets it
  BouncePausePct: 3.0     # pause when hard bounces pass this share of the window
  BounceWindow: 100       # ... of the mailbox's last this many sends
  BounceMinSample: 20     # ... once it has at least this many sends
  ComplaintPausePct: 0.1  # pause when complaints pass this share of the window
  ComplaintWindow: 1000   # ... of the mailbox's last this many sends
  ComplaintMinCount: 1    # ... once there are at least this many complaints
  PolicyBlocksPerDay: 3   # pause after this many policy or reputation blocks in a day
  ProviderFaultsToPause: 3 # pause after this many refused connections or sign-ins in a row
  DomainPauseShare: 0.5   # pause a domain when this share of its mailboxes are paused
  RepeatPauses: 2         # hold a tenant after this many list pauses ...
  RepeatPauseDays: 30     # ... within this many days
