name: Build and Deploy

# NeboAI's Outlet (NeboLoop/outlet, a fork of outlet-sh/outlet).
# main pushes ghcr.io/neboloop/outlet:main-<unix-ts>-<sha7>; Flux's ImagePolicy
# `outlet` picks the newest tag and its image automation rolls the Deployment
# in the k8s repo (outlet/). Pull requests from this repository build and test
# without pushing. Nothing here deploys mail.outlet.sh, which pulls
# ghcr.io/outlet-sh/outlet.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Only the newest image per branch deploys (Flux picks the latest tag), so a
# newer push cancels any in-flight build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Self-hosted: org runner in the Lima VM on the stadium Mac mini (arm64).
    # The Dockerfile cross-compiles on the build platform, so the amd64 image
    # is built natively rather than under emulation. Never a GitHub-hosted
    # runner. Pull requests from other repositories do not run here: this
    # repository is public and the runner is ours.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, neboloop]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: |
          docker run --rm -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false \
            golang:1.27-alpine go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Daemon builder: layer caches persist between builds.
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get timestamp and short SHA
        id: vars
        run: |
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.timestamp }}-${{ steps.vars.outputs.short_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          # DOKS nodes are amd64.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
