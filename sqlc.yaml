version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema:
      - "internal/db/migrations"
      - "internal/db/migrations/columns"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
